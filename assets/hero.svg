<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Abdul Rafey — AI Agent Engineer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7931E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .fade { opacity: 0; animation: fade .9s ease forwards; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .30s }
      .d3 { animation-delay: .50s } .d4 { animation-delay: .70s } .d5 { animation-delay: .90s }
      @keyframes fade { to { opacity: 1 } }
      .rule { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.4s .5s cubic-bezier(.2,.7,.3,1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:.7 } }
      .name { font: 700 68px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
      .role { font: 600 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 5.5px; }
      .line { font: 400 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .meta { font: 500 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0D1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g class="pulse">
    <circle cx="1050" cy="92" r="2.5" fill="#FF6B35"/>
    <circle cx="1096" cy="140" r="2.5" fill="#FF6B35"/>
    <circle cx="1004" cy="152" r="2.5" fill="#FF6B35"/>
    <circle cx="1122" cy="86" r="2.5" fill="#FF6B35"/>
    <path d="M1050 92 L1096 140 M1050 92 L1004 152 M1096 140 L1122 86" stroke="#FF6B35" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <text x="72" y="132" class="name fade d1" fill="#E6EDF3">Abdul Rafey</text>

  <line x1="72" y1="162" x2="592" y2="162" class="rule" stroke="url(#accent)" stroke-width="2"/>

  <text x="72" y="199" class="role fade d2" fill="#FF6B35">AI AGENT ENGINEER</text>

  <text x="72" y="243" class="line fade d3" fill="#8B949E">100 agents. One keyboard.<tspan class="caret" fill="#FF6B35" dx="8">▌</tspan></text>

  <g class="fade d4">
    <text x="72" y="292" class="meta" fill="#6E7681">SINCE 2019</text>
    <text x="210" y="292" class="meta" fill="#30363D">/</text>
    <text x="236" y="292" class="meta" fill="#6E7681">PYTHON · TYPESCRIPT</text>
    <text x="472" y="292" class="meta" fill="#30363D">/</text>
    <text x="498" y="292" class="meta" fill="#6E7681">REMOTE</text>
  </g>

  <g class="fade d5">
    <circle cx="1128" cy="292" r="4" fill="#2EA043"/>
    <text x="1112" y="296" class="meta" fill="#2EA043" text-anchor="end">AVAILABLE</text>
  </g>
</svg>
