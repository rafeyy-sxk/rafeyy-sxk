<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Abdul Rafey — AI Agent Engineer">
<defs>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#E6EDF3"/>
    <stop offset="42%"  stop-color="#E6EDF3"/>
    <stop offset="50%"  stop-color="#FF8A4C"/>
    <stop offset="58%"  stop-color="#E6EDF3"/>
    <stop offset="100%" stop-color="#E6EDF3"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF6B35"/>
    <stop offset="60%" stop-color="#FF6B35" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bgglow" cx="78%" cy="38%" r="55%">
    <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0 L0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.030" stroke-width="1"/>
  </pattern>
  <clipPath id="typeclip">
    <rect x="72" y="248" width="0" height="30">
      <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <style>
    .name  { font: 700 70px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing:-2px; }
    .role  { font: 600 16px ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:6px; }
    .mono  { font: 400 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    .stat  { font: 700 21px ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    .lbl   { font: 500 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:2px; }
    .in    { opacity:0; animation: in .8s ease forwards }
    .a1{animation-delay:.05s}.a2{animation-delay:.25s}.a3{animation-delay:.45s}
    .a4{animation-delay:.65s}.a5{animation-delay:.85s}.a6{animation-delay:1.05s}
    @keyframes in { to { opacity:1 } }
    .draw { stroke-dasharray:560; stroke-dashoffset:560; animation: draw 1.6s .35s cubic-bezier(.2,.75,.25,1) forwards }
    @keyframes draw { to { stroke-dashoffset:0 } }
    .blink { animation: blink 1.05s steps(1) infinite }
    @keyframes blink { 50% { opacity:0 } }
  </style>
</defs>

<rect width="1200" height="420" fill="#0D1117"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<rect width="1200" height="420" fill="url(#bgglow)"/>

<!-- agent swarm -->
<g transform="translate(830,60)">
  <g stroke="#FF6B35" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path id="e1" d="M150 120 L 60 40"/>
    <path id="e2" d="M150 120 L 250 46"/>
    <path id="e3" d="M150 120 L 40 190"/>
    <path id="e4" d="M150 120 L 262 186"/>
    <path id="e5" d="M150 120 L 150 236"/>
    <path id="e6" d="M60 40 L 250 46"/>
    <path id="e7" d="M40 190 L 150 236"/>
    <path id="e8" d="M262 186 L 150 236"/>
  </g>

  <circle cx="150" cy="120" r="34" fill="url(#halo)"/>
  <circle cx="150" cy="120" r="9" fill="#FF6B35">
    <animate attributeName="r" values="9;11.5;9" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="120" r="9" fill="none" stroke="#FF6B35" stroke-width="1.5">
    <animate attributeName="r" values="9;30" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <g fill="#8B949E">
    <circle cx="60"  cy="40"  r="4.5"><animate attributeName="fill" values="#8B949E;#FF8A4C;#8B949E" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="46"  r="4.5"><animate attributeName="fill" values="#8B949E;#FF8A4C;#8B949E" dur="3.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="40"  cy="190" r="4.5"><animate attributeName="fill" values="#8B949E;#FF8A4C;#8B949E" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="262" cy="186" r="4.5"><animate attributeName="fill" values="#8B949E;#FF8A4C;#8B949E" dur="4.1s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="236" r="4.5"><animate attributeName="fill" values="#8B949E;#FF8A4C;#8B949E" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#FFB38A">
    <circle r="2.6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.9s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.4s" begin="1.3s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.1s" begin="0.2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="2.2"><animateMotion dur="3.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
    <circle r="2.2"><animateMotion dur="3.6s" begin="0.7s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
    <circle r="2.2"><animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
  </g>
</g>

<text x="72" y="140" class="name in a1" fill="url(#sweep)">Abdul Rafey</text>
<line x1="72" y1="172" x2="632" y2="172" class="draw" stroke="url(#rule)" stroke-width="2"/>
<text x="72" y="210" class="role in a2" fill="#FF6B35">AI AGENT ENGINEER</text>

<g clip-path="url(#typeclip)">
  <text x="72" y="270" class="mono" fill="#8B949E">100 agents. One keyboard.</text>
</g>
<text x="410" y="270" class="mono blink" fill="#FF6B35">▌</text>

<g class="in a4">
  <text x="72"  y="344" class="stat" fill="#E6EDF3">632</text>
  <text x="72"  y="362" class="lbl"  fill="#6E7681">TESTS GREEN</text>
  <rect x="72" y="372" width="0" height="2" fill="#FF6B35"><animate attributeName="width" values="0;86" dur="1.1s" begin="1.0s" fill="freeze"/></rect>

  <text x="216" y="344" class="stat" fill="#E6EDF3">100</text>
  <text x="216" y="362" class="lbl"  fill="#6E7681">AGENTS PARALLEL</text>
  <rect x="216" y="372" width="0" height="2" fill="#FF6B35"><animate attributeName="width" values="0;120" dur="1.1s" begin="1.2s" fill="freeze"/></rect>

  <text x="396" y="344" class="stat" fill="#E6EDF3">0</text>
  <text x="396" y="362" class="lbl"  fill="#6E7681">DROPPED</text>
  <rect x="396" y="372" width="0" height="2" fill="#FF6B35"><animate attributeName="width" values="0;58" dur="1.1s" begin="1.4s" fill="freeze"/></rect>

  <text x="516" y="344" class="stat" fill="#E6EDF3">2019</text>
  <text x="516" y="362" class="lbl"  fill="#6E7681">SHIPPING SINCE</text>
  <rect x="516" y="372" width="0" height="2" fill="#FF6B35"><animate attributeName="width" values="0;110" dur="1.1s" begin="1.6s" fill="freeze"/></rect>
</g>

<g class="in a6">
  <circle cx="1136" cy="386" r="4" fill="#2EA043">
    <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1122" y="390" class="lbl" fill="#2EA043" text-anchor="end">AVAILABLE FOR WORK</text>
</g>
</svg>
